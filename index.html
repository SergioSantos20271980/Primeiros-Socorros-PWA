<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6f75"><link rel="manifest" href="manifest.json">
<title>Primeiros Socorros – PCR Adulto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f5;color:#17343a;font-family:Arial,sans-serif}
.top{background:#0b6f75;color:#fff;padding:15px}.top b{font-size:19px}.top small{display:block;margin-top:4px}
.wrap{max-width:720px;margin:auto;padding:18px 15px 100px}.ey{color:#0b6f75;font-weight:800;font-size:13px;letter-spacing:1px}
.title{font-size:29px;line-height:1.12}.card{background:#fff;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 4px 15px #0001}
.btn{width:100%;border:0;border-radius:14px;padding:15px;margin:5px 0;font-size:16px;font-weight:800;background:#0b6f75;color:#fff}
.light{background:#fff;color:#17343a;border:2px solid #d7e3e5}.red{background:#b93338}.blue{background:#286e98}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.warn{background:#fff3f3;border-left:5px solid #c33;padding:13px;border-radius:9px}
.ok{background:#edf8f1;border-left:5px solid #2c8b5b;padding:13px;border-radius:9px}.small{font-size:12px;color:#60777c}
.timer{font-size:60px;text-align:center;font-weight:900;letter-spacing:1px}.bar{height:9px;background:#dce7e8;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#0b6f75}
.metronome{font-size:48px;text-align:center;font-weight:900;margin:12px}.beat{animation:pulse .5s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.row{display:flex;gap:8px}.row button{flex:1}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e5f3f3;color:#0b6f75;font-size:12px;font-weight:bold}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e3e5;padding:9px 12px;display:flex;justify-content:space-between}.footer button{border:0;border-radius:11px;padding:11px 15px;font-weight:bold}
@media(max-width:520px){.grid{grid-template-columns:1fr}.title{font-size:26px}}
</style></head><body>
<header class="top"><b>♥ PRIMEIROS SOCORROS · PROTOCOLO RCP</b><small>PCR ADULTO · MODO PROFISSIONAL · V4</small></header>
<main id="app"></main><div class="footer"><button id="back">← Voltar</button><span id="pg"></span><button id="next">Avançar →</button></div>
<script>
let n=0,timer=null,sec=10,metro=null,beatTimer=null,beatCount=0,sound=true;
const A=document.getElementById('app'),pg=document.getElementById('pg');
function speak(t){if(sound&&speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;speechSynthesis.speak(u)}}
function beep(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const S=[
()=>`<div class="wrap"><div class="ey">PCR ADULTO · FINAL</div><h1 class="title">Protocolo RCP — Modo Profissional</h1><p>Versão de treinamento com áudio, metrônomo e cronômetros.</p><div class="card"><b>Conteúdo</b><p>Reconhecimento · pulso · RCP · metrônomo · ciclos de 2 min · ritmo · desfibrilação · medicação · via aérea · 5 H + 5 T · ROSC.</p><span class="badge">AHA 2025</span></div><button class="btn" onclick="speak('Iniciando protocolo de PCR adulto')">🔊 Ouvir</button><div class="warn">Protótipo educacional. Validar por profissional qualificado e protocolo institucional antes de uso clínico.</div></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 01</div><h1 class="title">Reconhecimento da PCR</h1><div class="card"><b>Inconsciente + respiração ausente/anormal</b><p>Profissional de saúde: verificar pulso por <b>no máximo 10 segundos</b>.</p></div><div class="warn">Sem pulso definido: assumir PCR e iniciar RCP.</div><button class="btn" onclick="go(2);speak('Verifique o pulso por no máximo dez segundos')">🫀 Checar pulso</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 02</div><h1 class="title">Pulso — máximo 10 s</h1><div class="card"><div id="t" class="timer">00:10</div><div class="bar"><i id="pb"></i></div><button class="btn" onclick="pulseStart()">▶ Iniciar cronômetro</button></div><div class="ok">Se não houver pulso com certeza, iniciar compressões imediatamente.</div></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 03</div><h1 class="title">RCP de alta qualidade</h1><div class="grid"><div class="card"><b>100–120/min</b><p>Frequência das compressões</p></div><div class="card"><b>≥ 5 cm</b><p>Profundidade; evitar >6 cm</p></div></div><div class="card"><b>30:2</b><p>Sem via aérea avançada. Retorno completo do tórax, mínimas interrupções e evitar ventilação excessiva.</p></div><button class="btn" onclick="go(4);speak('Abra o metrônomo de compressões')">🎵 Metrônomo</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 04 · TREINAMENTO</div><h1 class="title">Metrônomo 100–120/min</h1><div class="card"><div id="mb" class="metronome">●</div><p style="text-align:center"><b id="bpm">110 bpm</b></p><div class="row"><button class="btn" onclick="metroStart()">▶ Iniciar</button><button class="btn light" onclick="metroStop()">■ Parar</button></div><p class="small">O som marca o ritmo das compressões. Ajuste o BPM entre 100 e 120.</p><input id="rate" type="range" min="100" max="120" value="110" style="width:100%" oninput="setRate(this.value)"></div></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 05 · CICLO</div><h1 class="title">RCP — 2 minutos</h1><div class="card"><div id="c" class="timer">02:00</div><div class="bar"><i id="cb"></i></div><button class="btn" onclick="cprStart()">▶ Iniciar ciclo</button><button class="btn light" onclick="cprStop()">■ Pausar</button></div><div class="warn"><b>Ao completar 2 min:</b> trocar compressor aproximadamente a cada 2 minutos e verificar o ritmo.</div></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 06</div><h1 class="title">Análise do ritmo</h1><p>Minimize a pausa na checagem.</p><div class="grid"><button class="card btn red" onclick="go(7);speak('Ritmo chocável')">⚡ VF / TV sem pulso<br><span class="small">CHOCÁVEL</span></button><button class="card btn blue" onclick="go(8);speak('Ritmo não chocável')">〰 AESP / Assistolia<br><span class="small">NÃO CHOCÁVEL</span></button></div></div>`,
()=>`<div class="wrap"><div class="ey">CAMINHO CHOCÁVEL</div><h1 class="title">VF / TV sem pulso</h1><div class="card"><b>⚡ Desfibrilação</b><p>Aplicar choque conforme equipamento e protocolo. Para desfibrilador bifásico, seguir a recomendação do fabricante; a AHA 2025 cita 120–200 J como exemplo de dose inicial quando apropriado.</p></div><div class="ok">Após o choque: retomar imediatamente RCP por 2 minutos.</div><button class="btn" onclick="go(9)">Sequência farmacológica →</button></div>`,
()=>`<div class="wrap"><div class="ey">CAMINHO NÃO CHOCÁVEL</div><h1 class="title">AESP / Assistolia</h1><div class="card"><b>🚫 Não desfibrilar</b><p>RCP de alta qualidade e <b>epinefrina o mais cedo possível</b>.</p></div><div class="card"><b>Epinefrina</b><p>1 mg IV/IO a cada 3–5 min.</p></div><button class="btn" onclick="go(9)">Sequência farmacológica →</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 07 · PROFISSIONAL</div><h1 class="title">Medicações</h1><div class="card"><b>Epinefrina</b><p><b>1 mg IV/IO a cada 3–5 min.</b></p><p class="small">Em ritmo não chocável: o mais cedo possível. Em ritmo chocável: após tentativas iniciais de desfibrilação, conforme algoritmo.</p></div><div class="card"><b>VF/TV sem pulso refratária</b><p>Considerar amiodarona 300 mg, depois 150 mg; ou lidocaína 1–1,5 mg/kg, depois 0,5–0,75 mg/kg.</p></div><div class="warn">Uso restrito a profissionais treinados e conforme protocolo.</div><button class="btn" onclick="go(10)">Via aérea →</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 08</div><h1 class="title">Via aérea avançada</h1><div class="card"><p>Considerar tubo endotraqueal ou dispositivo supraglótico conforme habilidade e contexto.</p><p>Capnografia/capnometria com onda contínua para confirmar e monitorar o tubo quando disponível.</p></div><div class="ok"><b>Com via aérea avançada:</b> compressões contínuas 100–120/min + 1 ventilação a cada 6 s (10/min).</div><button class="btn" onclick="go(11)">5 H + 5 T →</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 09</div><h1 class="title">Causas reversíveis</h1><div class="grid"><div class="card"><b>5 H</b><p>Hipovolemia<br>Hipóxia<br>H⁺ / acidose<br>Hipo/hipercalemia<br>Hipotermia</p></div><div class="card"><b>5 T</b><p>Pneumotórax hipertensivo<br>Tamponamento cardíaco<br>Toxinas<br>Trombose pulmonar<br>Trombose coronariana</p></div></div><button class="btn" onclick="go(12)">ROSC →</button></div>`,
()=>`<div class="wrap"><div class="ey">ETAPA 10</div><h1 class="title">ROSC?</h1><div class="card"><b>Retorno da circulação espontânea</b><p>Se houver ROSC, iniciar cuidados pós-PCR conforme protocolo institucional.</p></div><div class="grid"><button class="btn" onclick="speak('ROSC. Iniciar cuidados pós parada cardíaca')">✅ ROSC</button><button class="btn red" onclick="speak('Sem ROSC. Continuar o algoritmo de parada cardíaca')">↻ SEM ROSC</button></div><div class="warn">Sem ROSC: continuar ciclos de RCP e reavaliar o ritmo conforme algoritmo.</div><p class="small">Base técnica: AHA Guidelines for CPR & ECC 2025. Protótipo educacional; validar antes de uso clínico.</p></div>`
];
let bpm=110;
function render(){clearInterval(timer);A.innerHTML=S[n]();pg.textContent=(n+1)+'/'+S.length;document.getElementById('back').disabled=n===0;document.getElementById('next').disabled=n===S.length-1}
function go(x){n=Math.max(0,Math.min(S.length-1,x));render()}
function pulseStart(){clearInterval(timer);sec=10;speak('Verifique o pulso por no máximo dez segundos');timer=setInterval(()=>{sec--;let e=document.getElementById('t'),b=document.getElementById('pb');if(e)e.textContent='00:'+String(sec).padStart(2,'0');if(b)b.style.width=((10-sec)*10)+'%';if(sec<=0){clearInterval(timer);speak('Tempo encerrado. Se não houver pulso definido, iniciar RCP')}},1000)}
function cprStart(){clearInterval(timer);sec=120;speak('Inicie RCP de alta qualidade');timer=setInterval(()=>{sec--;let e=document.getElementById('c'),b=document.getElementById('cb');if(e)e.textContent=fmt(sec);if(b)b.style.width=((120-sec)/120*100)+'%';if(sec<=0){clearInterval(timer);speak('Dois minutos. Hora de trocar o compressor e verificar o ritmo');alert('2 minutos concluídos: troque o compressor e verifique o ritmo.')}},1000)}
function cprStop(){clearInterval(timer)}
function setRate(v){bpm=Number(v);let e=document.getElementById('bpm');if(e)e.textContent=bpm+' bpm';if(metro){metroStop();metroStart()}}
function metroStart(){metroStop();speak('Metrônomo iniciado. Mantenha cem a cento e vinte compressões por minuto');let ms=60000/bpm;beatTimer=setInterval(()=>{beep();let e=document.getElementById('mb');if(e){e.classList.add('beat');setTimeout(()=>e.classList.remove('beat'),180)}},ms);metro=true}
function metroStop(){clearInterval(beatTimer);metro=null}
document.getElementById('back').onclick=()=>go(n-1);document.getElementById('next').onclick=()=>go(n+1);render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
